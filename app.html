<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentOrBuy - simulator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f1a1c; color:#e6f2f0; min-height:100vh; }
  .wrap { max-width:780px; margin:0 auto; padding:28px 20px 80px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
  header h1 { font-size:22px; } header h1 span { color:#4fd1c5; }
  header a { color:#84a3a0; text-decoration:none; font-size:14px; }
  .card { background:#14262a; border:1px solid #23474c; border-radius:12px; padding:18px; margin-bottom:18px; }
  label { font-size:12px; color:#84a3a0; display:block; margin-bottom:4px; }
  input { background:#0f1a1c; border:1px solid #2a5c62; border-radius:8px; color:#e6f2f0; padding:9px 10px; font-size:14px; width:100%; }
  button { background:#4fd1c5; border:none; color:#082220; font-weight:700; padding:11px 22px; border-radius:9px; font-size:14px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:12px; }
  .verdict { font-size:26px; font-weight:800; margin-bottom:10px; }
  .verdict.buy { color:#4fd1c5; } .verdict.rent { color:#ffc857; }
  .stats { display:flex; gap:26px; flex-wrap:wrap; margin-top:8px; }
  .stat b { font-size:22px; color:#fff; display:block; }
  .stat span { font-size:12px; color:#84a3a0; }
  table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
  th, td { text-align:right; padding:7px 8px; border-bottom:1px solid #1d3a3f; }
  th:first-child, td:first-child { text-align:left; }
  th { color:#84a3a0; font-weight:600; font-size:12px; }
  td.win { color:#4fd1c5; font-weight:700; }
  .err { color:#ff8a8a; font-size:13px; margin-top:8px; }
  .fine { color:#587572; font-size:12px; margin-top:14px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Rent<span>OrBuy</span></h1><a href="index.html">home</a></header>

  <div class="card">
    <div class="row3">
      <div><label>Home price ($)</label><input id="price" type="number" value="400000"></div>
      <div><label>Down payment (%)</label><input id="down" type="number" value="20"></div>
      <div><label>Mortgage rate (%)</label><input id="rate" type="number" step="0.1" value="6.5"></div>
    </div>
    <div class="row3">
      <div><label>Mortgage term (years)</label><input id="years" type="number" value="30"></div>
      <div><label>Monthly rent ($)</label><input id="rent" type="number" value="2200"></div>
      <div><label>Rent growth (%/yr)</label><input id="rentg" type="number" step="0.5" value="3"></div>
    </div>
    <div class="row3">
      <div><label>Home appreciation (%/yr)</label><input id="appr" type="number" step="0.5" value="3"></div>
      <div><label>Investment return (%/yr)</label><input id="inv" type="number" step="0.5" value="7"></div>
      <div><label>Owner costs (% of value/yr)</label><input id="upkeep" type="number" step="0.5" value="2"></div>
    </div>
    <div class="row3">
      <div><label>Horizon (years)</label><input id="horizon" type="number" value="15"></div>
      <div></div>
      <div><label>&nbsp;</label><button id="go" style="width:100%">Simulate</button></div>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div id="out"></div>
  <div class="fine">Model: the renter invests the down payment and any monthly savings at the investment return; the owner invests savings when owning is cheaper. Net worth = equity + invested savings. Excludes transaction costs, taxes and deductions, which move the answer both ways.</div>
</div>
<script src="engine.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function usd(x){ return '$' + Math.round(x).toLocaleString('en-US'); }

  function calc(){
    let s;
    try {
      const opts = { homePrice:$('price').value, downPct:$('down').value, rate:$('rate').value, years:$('years').value,
        rent:$('rent').value, rentGrowth:$('rentg').value, appreciation:$('appr').value, investReturn:$('inv').value,
        upkeepPct:$('upkeep').value, horizonYears:$('horizon').value };
      localStorage.setItem('rentorbuy-settings', JSON.stringify(opts));
      s = RentBuyEngine.simulate(opts);
    } catch(e) {
      $('out').innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
      return;
    }
    const cross = s.crossover !== null ? 'Buying overtakes renting in year ' + s.crossover + '.' : 'Buying never catches renting within ' + $('horizon').value + ' years.';
    let html = '<div class="card"><div class="verdict ' + s.winner + '">' + (s.winner === 'buy' ? 'Buying wins' : 'Renting wins') + '</div>'
      + '<div>' + cross + '</div>'
      + '<div class="stats">'
      + '<div class="stat"><b>' + usd(s.finalBuy) + '</b><span>net worth buying</span></div>'
      + '<div class="stat"><b>' + usd(s.finalRent) + '</b><span>net worth renting</span></div>'
      + '<div class="stat"><b>' + usd(Math.abs(s.finalBuy - s.finalRent)) + '</b><span>gap at horizon</span></div>'
      + '<div class="stat"><b>' + usd(s.monthlyPmt) + '</b><span>mortgage payment</span></div>'
      + '</div></div>';
    html += '<div class="card"><label>Year by year</label><table><tr><th>Year</th><th>Buy net worth</th><th>Rent net worth</th><th>Equity</th><th>Balance</th></tr>'
      + s.rows.map(r => {
          const buyWins = r.buyNW >= r.rentNW;
          return '<tr><td>' + r.year + '</td><td class="' + (buyWins ? 'win' : '') + '">' + usd(r.buyNW) + '</td><td class="' + (buyWins ? '' : 'win') + '">' + usd(r.rentNW) + '</td><td>' + usd(r.equity) + '</td><td>' + usd(r.balance) + '</td></tr>';
        }).join('') + '</table></div>';
    $('out').innerHTML = html;
  }

  try {
    const st = JSON.parse(localStorage.getItem('rentorbuy-settings') || 'null');
    if (st) {
      $('price').value = st.homePrice; $('down').value = st.downPct; $('rate').value = st.rate; $('years').value = st.years;
      $('rent').value = st.rent; $('rentg').value = st.rentGrowth; $('appr').value = st.appreciation; $('inv').value = st.investReturn;
      $('upkeep').value = st.upkeepPct; $('horizon').value = st.horizonYears;
    }
  } catch(e) {}
  $('go').onclick = calc;
  calc();
})();
</script>
</body>
</html>
